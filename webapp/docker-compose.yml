services:
  app-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: analytics_app
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-dev_app_password}
    volumes:
      - app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics_app"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - dataplatform

  source-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: demo_data
      POSTGRES_USER: demo_reader
      POSTGRES_PASSWORD: dev_source_password
    volumes:
      - ./demo/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_reader -d demo_data"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - dataplatform


  web:
    build: .
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      DATABASE_URL: postgresql+psycopg://analytics:${APP_DB_PASSWORD:-dev_app_password}@app-db:5432/analytics_app
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_USER: analytics_app
      TRINO_CATALOG: default
      TRINO_SCHEMA: public
      QUERY_MAX_ROWS: "500"
    ports:
      - "5000:5000"
    depends_on:
      app-db:
        condition: service_healthy
    command: sh -c "python init_db.py && exec gunicorn --workers 2 --threads 4 --bind 0.0.0.0:5000 'app:create_app()'"
    networks:
      - dataplatform


volumes:
  app_db_data:


networks:
  dataplatform:
    external: true
    name: dataplatform

