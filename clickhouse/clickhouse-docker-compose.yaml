version: '3'

services:
  zookeeper:
    image: 'zookeeper:3.9.3'
    networks:
      - dataplatform
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOOKEEPER_CLIENT_PORT=2182
    ports:
      - "2182:2182"
      - "2888:2888"
      - "3888:3888"
    
  clickhouse_node_1:
    image: clickhouse/clickhouse-server:24.8.7.41
    volumes:
      - ./config/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./config/zookeeper.xml:/etc/clickhouse-server/config.d/zookeeper.xml
      - ./config/access_management.xml:/etc/clickhouse-server/users.d/access_management.xml
      - ./config/default-password.xml:/etc/clickhouse-server/users.d/default-password.xml
      - ./config/storage.xml:/etc/clickhouse-server/config.d/storage.xml
      - ./config/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml
      - ./config/macros1.xml:/etc/clickhouse-server/config.d/macros.xml
    ports:
      - "9000:9000"
      - "8123:8123"
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - dataplatform
    depends_on:
      - zookeeper
    links: 
      - zookeeper
      
  clickhouse_node_2:
    image: clickhouse/clickhouse-server:24.8.7.41
    volumes:
      - ./config/config2.xml:/etc/clickhouse-server/config.d/config.xml
      - ./config/zookeeper.xml:/etc/clickhouse-server/config.d/zookeeper.xml
      - ./config/access_management.xml:/etc/clickhouse-server/users.d/access_management.xml
      - ./config/default-password.xml:/etc/clickhouse-server/users.d/default-password.xml
      - ./config/storage.xml:/etc/clickhouse-server/config.d/storage.xml
      - ./config/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml
      - ./config/macros2.xml:/etc/clickhouse-server/config.d/macros.xml
    ports:
      - "9001:9000"
      - "8124:8123"
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - dataplatform
    depends_on:
      - zookeeper
    links: 
      - zookeeper
networks:
  dataplatform:
    driver: bridge