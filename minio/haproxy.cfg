
global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    timeout connect 10s
    timeout client 5m
    timeout server 5m
    timeout http-request 30s

# MinIO S3 API
frontend minio_s3
    bind *:9000
    default_backend minio_s3_nodes

backend minio_s3_nodes
    mode http
    balance roundrobin

    option httpchk
    http-check send meth GET uri /minio/health/live ver HTTP/1.1 hdr Host minio1
    http-check expect status 200

    default-server inter 3s fall 3 rise 2

    server minio1 minio1:9000 check
    server minio2 minio2:9000 check
    server minio3 minio3:9000 check
    server minio4 minio4:9000 check

# MinIO Console
frontend minio_console
    bind *:9001
    default_backend minio_console_nodes

backend minio_console_nodes
    balance roundrobin

    server minio1 minio1:9001 check
    server minio2 minio2:9001 check
    server minio3 minio3:9001 check
    server minio4 minio4:9001 check
