
services:
  delta:
    image: deltaio/delta-docker:4.3.1
    container_name: delta-lake
    entrypoint: ["bash", "-lc"]
    command: ["sleep infinity"]
    volumes:
      - ./data:/data
    working_dir: /data
    # restart: unless-stopped
    networks:
      - dataplatform

  minio:
    image: pgsty/minio
    container_name: minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        minio server /data --console-address ":9001" &
        until mc alias set local http://127.0.0.1:9000 minioadmin minioadmin123; do
          sleep 2
        done
        mc mb --ignore-existing local/lake
        wait
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data
    networks:
      - dataplatform



  metastore-db:
    image: postgres:16
    container_name: metastore-db
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: 12345678
    volumes:
      - metastore_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - dataplatform


  hive-metastore:
    image: apache/hive:4.0.1
    container_name: hive-metastore
    depends_on:
      metastore-db:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HIVE_AUX_JARS_PATH: /opt/hive/lib/postgresql-42.7.7.jar
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=12345678
      HADOOP_CLASSPATH: "/opt/hadoop/share/hadoop/tools/lib/*"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_REGION: us-east-1
    volumes:
      - ./postgresql-42.7.7.jar:/opt/hive/lib/postgresql-42.7.7.jar:ro
      - ./core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro

    ports:
      - "9083:9083"
    # restart: unless-stopped
    networks:
      - dataplatform



volumes:
  minio_data:
  metastore_db:



networks:
  dataplatform:
    external: true
    name: dataplatform













