
services:
  delta:
    image: deltaio/delta-docker:4.3.1
    container_name: delta-lake
    entrypoint: ["bash", "-lc"]
    command: ["sleep infinity"]
    volumes:
      - ./data:/data
    working_dir: /data
    restart: unless-stopped
    networks:
      - dataplatform

  minio:
    image: pgsty/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - dataplatform
volumes:
  minio_data:


networks:
  dataplatform:
    external: true
    name: dataplatform